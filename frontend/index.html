<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wails.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XK-Pane</title>
    <!-- 预加载终端等宽字体：HTML 解析阶段就并行下载，确保 React mount / 终端创建时字体已就绪，首个
         终端 fit 即用真实 cell 宽算列宽（否则 fallback cell 宽会让初始列宽偏，影响 resume 历史重放对齐）。 -->
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* 终端等宽字体：打包进前端，确保移动端 WebView 也用真等宽字体渲染，
         不再 fallback 到系统比例字体（那会让 xterm 按等宽 cell 摆比例字形 → 字符被拉开）。 */
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/JetBrainsMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* ===== 启动骨架 (Startup Skeleton) =====
         目的：webview 拿到 HTML 立刻显示版式骨架，等 React mount 完成后再淡出。
         消除 wails 启动 → React 渲染 之间的白屏（Windows / Linux 无边框窗口尤甚）。

         约束：
         - 颜色与默认 light 主题对齐；prefers-color-scheme: dark 时切到 dark preset 颜色
         - 不依赖任何 JS，纯 CSS / HTML 即可可见
         - 版式与真实 AppLayout 对齐：TitleBar 36px + Sidebar 64px + 主内容
         - shimmer 动画与 src/components/Skeleton 同款
         - 切到 prefers-reduced-motion 时关闭 shimmer
         - React mount 后，main.tsx 通过 #startup-skeleton 移除（带 120ms 淡出）
      */
      :root {
        --fdn-bg-base: #ffffff;
        --fdn-bg-sidebar: #f6f7fa;
        --fdn-bg-content: #ffffff;
        --fdn-bg-elevated: #eef1f6;
        --fdn-bg-hover: rgba(15, 23, 42, 0.08);
        --fdn-divider: rgba(15, 23, 42, 0.10);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fdn-bg-base: #0b0d10;
          --fdn-bg-sidebar: #15181d;
          --fdn-bg-content: #1c1f24;
          --fdn-bg-elevated: #2a2f37;
          --fdn-bg-hover: rgba(255, 255, 255, 0.06);
          --fdn-divider: rgba(255, 255, 255, 0.08);
          color-scheme: dark;
        }
      }
      /* --xk-vh：可见视口高度（px），由下方内联脚本写 visualViewport.height。
         手机浏览器地址栏 / 软键盘会改变可见高度，纯 100vh 会比可见区高 → 底部(输入框)被裁到屏外。
         用 var(--xk-vh, 100dvh)：脚本就绪前回退 100dvh(已排除地址栏)，就绪后精确跟随(含键盘)。 */
      html, body {
        margin: 0;
        padding: 0;
        height: var(--xk-vh, 100dvh);
        overflow: hidden;
        background-color: var(--fdn-bg-content);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        height: var(--xk-vh, 100dvh);
        display: flex;
        flex-direction: column;
      }

      /* —— 启动骨架本体 —— */
      #startup-skeleton {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        background-color: var(--fdn-bg-content);
        opacity: 1;
        transition: opacity 160ms ease-out;
        pointer-events: none;
      }
      #startup-skeleton.fade-out { opacity: 0; }

      /* TitleBar 占位（36px） */
      .ssk-titlebar {
        height: 36px;
        flex-shrink: 0;
        background-color: var(--fdn-bg-base);
        border-bottom: 1px solid var(--fdn-divider);
      }

      /* 主体两栏 */
      .ssk-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      /* Sidebar 占位（64px） */
      .ssk-sidebar {
        width: 64px;
        flex-shrink: 0;
        background-color: var(--fdn-bg-sidebar);
        border-right: 1px solid var(--fdn-divider);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0;
        gap: 8px;
      }
      .ssk-brand {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      .ssk-brand-divider {
        width: 40px;
        height: 1px;
        background-color: var(--fdn-divider);
        animation: none;
      }
      .ssk-nav-item {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      .ssk-grow { flex: 1; }

      /* 主内容占位 */
      .ssk-content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 48px;
      }
      .ssk-eyebrow { width: 140px; height: 12px; border-radius: 4px; }
      .ssk-hero    { width: 60%;   height: 36px; border-radius: 4px; }
      .ssk-line    { height: 14px; border-radius: 4px; }
      .ssk-line-1  { width: 100%; }
      .ssk-line-2  { width: 80%; }
      .ssk-card {
        width: 100%;
        max-width: 720px;
        height: 140px;
        border-radius: 12px;
        margin-top: 8px;
      }

      /* —— Shimmer 动画（与 Skeleton 组件同款） —— */
      .ssk-block {
        background-color: var(--fdn-bg-elevated);
        background-image: linear-gradient(
          90deg,
          var(--fdn-bg-elevated) 0%,
          var(--fdn-bg-hover) 50%,
          var(--fdn-bg-elevated) 100%
        );
        background-size: 200% 100%;
        background-repeat: no-repeat;
        animation: ssk-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes ssk-shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ssk-block { animation: none; }
      }
    </style>
  </head>
  <body>
    <!--
      启动骨架（独立于 #root，React mount 后由 main.tsx 移除）。
      千万不要塞进 #root —— createRoot.render() 会立即清空根节点，骨架就废了。
    -->
    <div id="startup-skeleton" aria-hidden="true">
      <div class="ssk-titlebar"></div>
      <div class="ssk-body">
        <div class="ssk-sidebar">
          <div class="ssk-brand ssk-block"></div>
          <div class="ssk-brand-divider"></div>
          <div class="ssk-nav-item ssk-block"></div>
          <div class="ssk-grow"></div>
          <div class="ssk-nav-item ssk-block"></div>
        </div>
        <div class="ssk-content">
          <div class="ssk-eyebrow ssk-block"></div>
          <div class="ssk-hero ssk-block"></div>
          <div class="ssk-line ssk-line-1 ssk-block"></div>
          <div class="ssk-line ssk-line-2 ssk-block"></div>
          <div class="ssk-card ssk-block"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <!--
      冷启动竞态自愈看门狗（一次性）：Wails+Vite 首次 dev 时，窗口常在 Vite 冷预打包依赖完成前
      就打开，main.tsx 模块图可能卡住 → React 未挂载、骨架不消（首次 dev 卡、第二次正常）。
      此处纯内联脚本（独立于 main.tsx，故 main.tsx 卡住时仍会执行）：若 8s 后 #root 仍为空（未
      挂载），自动重载一次（届时 Vite 已热 → 干净挂载）。用 window.name 守卫，绝不循环；生产构建
      bundle 本地秒挂载，#root 早已填充，看门狗永不触发。配合 vite.config 的 optimizeDeps.include。
    -->
    <script>
      (function () {
        try {
          if (window.name === "xk-devreload") {
            window.name = "";
            return;
          }
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount === 0) {
              window.name = "xk-devreload";
              location.reload();
            }
          }, 8000);
        } catch (e) {
          /* 看门狗自身失败绝不影响应用 */
        }
      })();
    </script>
    <!--
      可见视口高度同步（移动端关键）：把 visualViewport.height 写进 --xk-vh，驱动 html/body/#root 高度。
      解决两件事：① 手机地址栏占位时 100vh 比可见区高 → 底部输入框被裁到屏外（不可见）；
      ② 软键盘弹出时 visualViewport.height 收缩 → 整体收缩 → 输入框始终浮在键盘之上。
      桌面 webview：visualViewport.height = 窗口内容高，等价于原 100vh，无副作用。脚本失败则回退 CSS 100dvh。
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var sync = function () {
            var vv = window.visualViewport;
            var h = vv ? vv.height : window.innerHeight;
            if (h > 0) root.style.setProperty("--xk-vh", h + "px");
          };
          sync();
          window.addEventListener("resize", sync);
          window.addEventListener("orientationchange", sync);
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", sync);
            window.visualViewport.addEventListener("scroll", sync);
          }
          // 软键盘聚焦/失焦后视口为异步变化，补几拍重算。
          var resync = function () { setTimeout(sync, 120); setTimeout(sync, 320); };
          window.addEventListener("focusin", resync);
          window.addEventListener("focusout", resync);
        } catch (e) {
          /* 视口同步失败不影响应用（CSS 回退 100dvh） */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
